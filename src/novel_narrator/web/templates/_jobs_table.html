<table>
  <thead><tr><th>#</th><th>Novel</th><th>Saídas</th><th>Capítulos</th><th>Situação</th></tr></thead>
  <tbody>
    {% for job in jobs %}
    <tr>
      <td><a href="/jobs/{{ job.id }}">{{ job.id }}</a></td>
      <td>{{ job.title }}</td>
      <td>{{ describe_outputs(job.outputs) }}</td>
      <td>{{ job.done }}/{{ job.total }}</td>
      <td>{{ status_names[job.status] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
