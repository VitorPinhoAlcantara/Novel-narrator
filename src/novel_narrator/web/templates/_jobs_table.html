<div class="job-list">
  {% for job in jobs %}
  <a class="card job-row" href="/jobs/{{ job.id }}">
    <div>
      <strong>{{ job.title }}</strong>
      <div class="meta">#{{ job.id }} · {{ describe_outputs(job.outputs) }} · {{ job.done }}/{{ job.total }} capítulos</div>
    </div>
    <span class="badge {{ job.status }}">{{ status_names[job.status] }}</span>
    <div class="bar {{ 'done' if job.status == 'done' }}"><span style="width: {{ job.percent }}%"></span></div>
  </a>
  {% endfor %}
</div>
